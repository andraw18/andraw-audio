<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050607">
  <title>ANDRAW — управление сайтом</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; display: grid; place-items: center; padding: 28px; background: #050607; color: #f3f3f1; font-family: Arial, sans-serif; }
    main { width: min(720px, 100%); padding: clamp(34px, 7vw, 72px); border: 1px solid #303438; background: linear-gradient(145deg, #0c1013, #050607 65%); }
    img { width: 54px; filter: brightness(0) invert(1); opacity: .72; }
    small { display: block; margin: 42px 0 14px; color: #6f767b; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 560px; font-size: clamp(36px, 7vw, 72px); font-weight: 400; line-height: .98; }
    p { max-width: 520px; margin: 28px 0 46px; color: #a4a9ac; font-size: 15px; line-height: 1.7; }
    a { display: inline-flex; justify-content: space-between; width: min(100%, 360px); padding: 17px 0; border-bottom: 1px solid #d7d9da; color: inherit; text-decoration: none; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    a:hover { color: #aeb7bd; }
  </style>
</head>
<body>
  <main>
    <img src="../assets/site/mask.svg" alt="">
    <small>ANDRAW · управление контентом</small>
    <h1>Админка сайта</h1>
    <p>Афиши, фотографии, музыка, видео и тексты редактируются через Pages CMS. Войди через GitHub и выбери репозиторий <b>andraw18/andraw-audio</b>.</p>
    <a href="https://app.pagescms.org/andraw18/andraw-audio/main/file/site-content" rel="noreferrer">Открыть редактор <span>↗</span></a>
  </main>
</body>
</html>
